name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run the full suite
        # No install step, mirroring genesis law G11: conftest.py wires
        # packages/*/src onto sys.path. The suite pins the golden genesis
        # hashes and the two named invariants (no admin key in the kernel;
        # upgrade path is Proposal + Ballot only).
        run: pytest -q

  package:
    # Prove the lab-v0 packaging works from a clean venv: an editable install
    # exposes the `chronarch` console script, and one pulse runs end to end.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Editable install with dev extra
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Full suite against the installed distribution
        # Also runs the pip-metadata test for real: top_level.txt must name
        # all eleven workspace packages.
        run: python -m pytest -q
      - name: One pulse on a fresh home (loopback lab, not a public network)
        run: python -m chronarch_cli pulse --home "$RUNNER_TEMP/solo" --slots 1
      - name: Read the home's memory back (read-only)
        run: python -m chronarch_cli memory --home "$RUNNER_TEMP/solo"
      - name: The console_script entry point also runs
        run: chronarch status && chronarch pulse --home "$RUNNER_TEMP/solo2" --slots 1
