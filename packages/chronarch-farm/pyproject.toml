[project]
name = "chronarch-farm"
version = "0.0.1"
description = "Chronarch farm package: dual-farm plot lane, abstract-to-plot adapter (Phase 4)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
